name: build ustreamer

on:
  push:
    branches: [ main ]
    paths:
      - .gitea/workflows/build.yml
      - 'ustreamer_api/**'
  workflow_dispatch: {}

jobs:
  build-image:
    runs-on: dind
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        run: echo "IMAGE=git.localdomain.net/docker/images/ustreamer-api:latest" >> $GITHUB_OUTPUT

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.localdomain.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Build Docker image
        working-directory: ustreamer_api
        run: docker build -t ${{ steps.vars.outputs.IMAGE }} .

      - name: Push Docker image
        run: docker push ${{ steps.vars.outputs.IMAGE }}
