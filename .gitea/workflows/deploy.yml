name: deploy ustreamer

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-image:
    runs-on: dind
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image variables
        id: vars
        run: echo "IMAGE=git.localdomain.net/docker/images/ustreamer-api:latest" >> $GITHUB_OUTPUT

      - name: Login to Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: git.localdomain.net
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Build Docker image
        working-directory: ustreamer_api
        run: docker build -t ${{ steps.vars.outputs.IMAGE }} .

      - name: Push Docker image
        run: docker push ${{ steps.vars.outputs.IMAGE }}

  deploy:
    needs: build-image
    runs-on: ssh
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: set up ssh key
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh

          echo '${{ secrets.PKEY_DEPLOY_USER }}' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          cat << EOF | tee ~/.ssh/config
          Host *
              User deploy
              IdentityFile ~/.ssh/id_deploy
          EOF

          # Pre-populate known_hosts so SSH won't prompt
          ssh-keyscan picam.localdomain.net >> ~/.ssh/known_hosts

      - name: run deploy.sh
        env:
          CERT_APPROLE_ID: "${{ secrets.CERT_APPROLE_ID }}"
        run: ./deploy.sh picam.localdomain.net
