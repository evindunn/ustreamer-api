name: build evindunn/ustreamer-api:latest

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'Dockerfile'
      - 'poetry.lock'
      - 'pyproject.toml'
      - 'tests/**'
      - 'ustreamer_api/**'
  workflow_dispatch: {}

jobs:
  test:
    name: Run tests with coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install test dependencies
        run: poetry install --with dev

      - name: Run tests with coverage
        run: poetry run python -m pytest --cov=ustreamer_api --cov-report=term-missing

  push_to_registry:
    name: Push Docker image to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set image variables
        id: vars
        run: |
          echo "IMAGE=evindunn/ustreamer-api" >> "$GITHUB_OUTPUT"
          echo "TAG=latest" >> "$GITHUB_OUTPUT"
          echo "CONTEXT=." >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          context: '${{ steps.vars.outputs.CONTEXT }}'
          tags: '${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.TAG }}'
