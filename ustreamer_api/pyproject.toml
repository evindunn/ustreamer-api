[project]
name = "ustreamer-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Evin Dunn"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.135.3,<1.0.0)",
    "uvicorn (>=0.44.0,<1.0.0)"
]

[project.scripts]
test = "pytest:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-cov = "^6.2.1"
httpx = "^0.28.1"

[tool.pytest.ini_options]
addopts = "--cov=ustreamer_api --cov-report=term-missing"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
